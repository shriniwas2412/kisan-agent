name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "mandi-mcp @ git+https://github.com/Shriniwas2412/mandi-mcp"
      - run: pip install -e ".[dev,vision]"
      - run: pytest -q
